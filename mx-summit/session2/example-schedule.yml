# Example: run the daily briefing on a schedule with GitHub Actions.
#
# To use it, copy this file to .github/workflows/mx-briefing.yml in your fork
# and add three repository secrets: PM_CLIENT_ID, PM_CLIENT_SECRET, PM_TENANT_ID.
#
# What it does:  reads your Property Meld account, writes the briefing to
#                mx-summit/out/, and saves that folder as a downloadable artifact.
# What it never does: email, text, Slack, or post anything anywhere.
#                     You download the artifact and read it.

name: MX Summit — Daily Briefing

on:
  schedule:
    # 7:30am US Eastern on weekdays. GitHub cron is in UTC, so this is 11:30 UTC
    # (12:30 UTC during standard time — adjust if the hour matters to you).
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand to test

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the briefing against live Property Meld data
        env:
          PM_MODE: api
          PM_CLIENT_ID: ${{ secrets.PM_CLIENT_ID }}
          PM_CLIENT_SECRET: ${{ secrets.PM_CLIENT_SECRET }}
          PM_TENANT_ID: ${{ secrets.PM_TENANT_ID }}
        run: |
          mkdir -p mx-summit/out
          echo "run started $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> mx-summit/out/run.log
          python3 mx-summit/solutions/daily_briefing.py | tee -a mx-summit/out/run.log
          echo "run finished $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> mx-summit/out/run.log

      - name: Save the output so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-briefing
          path: mx-summit/out/
          retention-days: 14
